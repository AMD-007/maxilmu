<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kemajuan Anak — Maahad Cahaya Ilmu</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="app.css">
<script src="../site-config.js"></script>
<script>document.title = `Kemajuan Anak — ${SITE_CONFIG.name}`;</script>
</head>
<body class="portal-body">

<header class="portal-header">
  <div class="portal-header__brand">
    <span class="mark-crop portal-header__mark"><img src="../logo-transparent.png" data-config-logo data-config-alt="name" alt="Lambang Maahad Cahaya Ilmu"></span>
    <div>
      <strong data-config="name">Maahad Cahaya Ilmu</strong>
      <span class="portal-header__sub">Paparan Ibu Bapa</span>
    </div>
  </div>
  <div class="portal-header__actions">
    <span class="portal-header__credit">Dikuasakan oleh MaxIlmu</span>
    <button class="btn btn--ghost btn--small" id="btn-logout" type="button">Log Keluar</button>
  </div>
</header>

<main class="portal-main container">
  <section class="card parent-summary">
    <h1 id="parent-student-name"></h1>
    <p id="parent-student-meta"></p>
  </section>

  <div class="stat-grid" id="parent-stats"></div>

  <section class="card">
    <div class="card__head">
      <h2>Keputusan Peperiksaan</h2>
      <span class="panel-head__meta">Awal &middot; Pertengahan &middot; Akhir Tahun</span>
    </div>
    <p class="card__hint">Keputusan bagi ketiga-tiga peperiksaan tahunan. Sesi yang belum berlangsung dipaparkan sebagai "—".</p>
    <div class="table-wrap" id="results-table-wrap"></div>
  </section>

  <section class="card">
    <div class="card__head">
      <h2>Kehadiran Bulanan</h2>
      <span class="panel-head__meta" id="attendance-pct-meta"></span>
    </div>
    <p class="card__hint" id="attendance-caption"></p>
    <div class="chart-card" id="attendance-chart-mount"></div>
    <div class="table-wrap" id="attendance-table-wrap"></div>
  </section>

  <section class="card">
    <div class="card__head">
      <h2 id="hafazan-title">Hafazan</h2>
      <span class="panel-head__meta" id="hafazan-pct-meta"></span>
    </div>
    <p class="card__hint" id="hafazan-caption"></p>
    <div class="chart-card" id="hafazan-chart-mount"></div>
    <div class="table-wrap" id="hafazan-table-wrap"></div>
  </section>

  <!-- Yuran section is created and appended by JS only when
       FEATURES.finance is true — nothing is rendered here otherwise. -->
</main>

<script src="data.js"></script>
<script src="charts.js"></script>
<script>
(function () {
  // ── Session guard — this page is parent-only, and the studentId
  //    in the session must still exist (a demo reset can invalidate it) ──
  const session = getSession();
  const state = loadState();
  const student = session && session.role === "parent" ? getStudent(state, session.studentId) : null;
  if (!student) {
    clearSession();
    window.location.href = "login.html";
    return;
  }

  document.getElementById("btn-logout").addEventListener("click", () => {
    clearSession();
    window.location.href = "login.html";
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  document.getElementById("parent-student-name").textContent = student.name;
  document.getElementById("parent-student-meta").textContent = `${student.className} · Ibu bapa: ${student.parentName}`;

  const hafazan = state.settings.hafazan;
  const hafazanTotal = getHafazanTotal(student);
  const hafazanPct = Math.min(100, Math.round((hafazanTotal / hafazan.total) * 100));

  // ── Top stat tiles ────────────────────────────────────────────
  const latestExam = EXAM_PERIODS.slice().reverse().find((exam) => examAverage(state, student, exam.key) !== null);
  const latestAttendance = getLatestAttendanceEntry(student);
  document.getElementById("parent-stats").innerHTML = `
    <div class="stat-tile">
      <span class="stat-tile__label">Kehadiran</span>
      <div class="stat-tile__value">${latestAttendance ? latestAttendance.rate + "%" : "—"}</div>
      <p class="stat-tile__sub">${latestAttendance ? formatMonth(latestAttendance.month) : "Belum ada rekod"}</p>
    </div>
    <div class="stat-tile">
      <span class="stat-tile__label">Purata Terkini</span>
      <div class="stat-tile__value">${latestExam ? examAverage(state, student, latestExam.key) + "%" : "—"}</div>
      <p class="stat-tile__sub">${latestExam ? latestExam.label : "Belum ada keputusan"}</p>
    </div>
    <div class="stat-tile">
      <span class="stat-tile__label">Kemajuan Hafazan</span>
      <div class="stat-tile__value">${hafazanPct}%</div>
      <p class="stat-tile__sub">${hafazanTotal} / ${hafazan.total} ${hafazanUnitLabel(hafazan.unit, hafazan.total)}</p>
    </div>
  `;

  // ── Keputusan Peperiksaan — subjects x 3 fixed exam sittings ────
  // Always the CURRENT academic year's record (see getCurrentExamRecord
  // in data.js) — Tier 1 has no year picker yet, so this is exactly
  // what "this student's results" means for now. Falls back to an
  // empty marks shape rather than crashing if a student somehow has
  // no current-year record yet.
  const currentExamRecord = getCurrentExamRecord(student);
  const currentMarks = currentExamRecord ? currentExamRecord.marks : { awal: {}, pertengahan: {}, akhir: {} };
  const activeSubjects = state.settings.subjects.filter((subj) =>
    EXAM_PERIODS.some((exam) => Object.prototype.hasOwnProperty.call(currentMarks[exam.key], subj))
  );
  const resultsWrap = document.getElementById("results-table-wrap");
  if (!activeSubjects.length) {
    resultsWrap.innerHTML = '<p class="empty-note">Belum ada keputusan peperiksaan direkodkan.</p>';
  } else {
    const bodyRows = activeSubjects.map((subj) => {
      const cells = EXAM_PERIODS.map((exam) => {
        const val = currentMarks[exam.key][subj];
        return `<td data-label="${exam.label}">${typeof val === "number" ? val + "%" : '<span class="cell-muted">—</span>'}</td>`;
      }).join("");
      return `<tr><td data-label="Subjek">${escapeHtml(subj)}</td>${cells}</tr>`;
    }).join("");
    const avgCells = EXAM_PERIODS.map((exam) => {
      const avg = examAverage(state, student, exam.key);
      return `<td class="col-num" data-label="${exam.label}">${avg === null ? "—" : avg + "%"}</td>`;
    }).join("");
    resultsWrap.innerHTML = `
      <table class="data-table stack-table">
        <thead>
          <tr><th>Subjek</th>${EXAM_PERIODS.map((exam) => `<th>${exam.label}</th>`).join("")}</tr>
        </thead>
        <tbody>${bodyRows}</tbody>
        <tfoot><tr><td data-label="Subjek">Purata</td>${avgCells}</tr></tfoot>
      </table>
    `;
  }

  // ── Kehadiran — monthly log rendered as table + trend chart ─────
  const attendanceSettings = state.settings.attendance;
  const attendanceAverage = getAttendanceAverage(student);
  document.getElementById("attendance-pct-meta").textContent =
    attendanceAverage === null ? "" : `Purata ${attendanceAverage}% · Sasaran ${attendanceSettings.target}%`;
  document.getElementById("attendance-caption").textContent =
    "Kehadiran direkod setiap bulan, dibandingkan dengan sasaran madrasah.";

  const attendancePoints = attendanceRatePoints(student);
  renderAttendanceChart(document.getElementById("attendance-chart-mount"), attendancePoints, attendanceSettings.target);

  const attendanceTableWrap = document.getElementById("attendance-table-wrap");
  if (!attendancePoints.length) {
    attendanceTableWrap.innerHTML = '<p class="empty-note">Belum ada rekod kehadiran bulanan.</p>';
  } else {
    const attendanceRowsDesc = attendancePoints.slice().reverse();
    attendanceTableWrap.innerHTML = `
      <table class="data-table stack-table">
        <thead><tr><th>Bulan</th><th>Kehadiran</th></tr></thead>
        <tbody>
          ${attendanceRowsDesc.map((p) => `
            <tr>
              <td data-label="Bulan">${formatMonth(p.entry.month)}</td>
              <td data-label="Kehadiran">${p.entry.rate}%</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  // ── Hafazan — weekly log rendered as table + cumulative chart ───
  document.getElementById("hafazan-title").textContent = `Hafazan (${hafazanUnitLabel(hafazan.unit, 2)})`;
  document.getElementById("hafazan-pct-meta").textContent = `${hafazanPct}% daripada sasaran`;
  document.getElementById("hafazan-caption").textContent =
    `${hafazanTotal} daripada ${hafazan.total} ${hafazanUnitLabel(hafazan.unit, hafazan.total)} dihafaz, direkodkan mengikut minggu.`;

  const points = hafazanCumulativePoints(student);
  renderHafazanChart(document.getElementById("hafazan-chart-mount"), points, hafazan.total, hafazanUnitLabel(hafazan.unit, hafazan.total));

  const hafazanTableWrap = document.getElementById("hafazan-table-wrap");
  if (!points.length) {
    hafazanTableWrap.innerHTML = '<p class="empty-note">Belum ada rekod hafazan mingguan.</p>';
  } else {
    const rowsDesc = points.slice().reverse();
    hafazanTableWrap.innerHTML = `
      <table class="data-table stack-table">
        <thead><tr><th>Minggu (Tarikh)</th><th>Tambahan</th><th>Catatan</th><th>Terkumpul</th></tr></thead>
        <tbody>
          ${rowsDesc.map((p) => `
            <tr>
              <td data-label="Minggu (Tarikh)">${formatDate(p.entry.date)}</td>
              <td data-label="Tambahan">+${p.entry.amount} ${hafazanUnitLabel(hafazan.unit, p.entry.amount)}</td>
              <td data-label="Catatan">${p.entry.note ? escapeHtml(p.entry.note) : '<span class="cell-muted">—</span>'}</td>
              <td data-label="Terkumpul">${p.cumulative}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  // ── Yuran — only built into the DOM when FEATURES.finance is true ──
  if (FEATURES.finance) {
    const mount = document.createElement("section");
    mount.className = "card";
    mount.id = "yuran-mount";
    document.querySelector(".portal-main").appendChild(mount);

    const balance = getStudentBalance(student);
    const breakdown = getFeeBreakdown(state, student);
    const outstandingTypes = breakdown.filter((b) => b.outstanding > 0);

    // Judgment call: when there's nothing owed, the WhatsApp button is
    // dropped along with the balance headline — there's nothing left to
    // inquire about. The ledger history toggle stays either way, since
    // a parent may still want to see past transactions at RM0.
    const waButton = balance > 0 ? (() => {
      const owedList = outstandingTypes.map((b) => `${b.name} ${formatMoney(b.outstanding)}`).join(", ");
      const waText = encodeURIComponent(`Assalamualaikum, saya ibu bapa kepada ${student.name} (${student.className}). Baki tertunggak: ${owedList}.`);
      return `<a class="btn btn--small" href="https://wa.me/${state.settings.adminContactNumber}?text=${waText}" target="_blank" rel="noopener">Hubungi Admin Tentang Yuran</a>`;
    })() : "";

    const balanceBlock = balance <= 0 ? `
      <p class="fee-clear">Tiada baki tertunggak.</p>
    ` : `
      <div class="fee-balance">
        <span class="fee-balance__label">Jumlah Tertunggak</span>
        <div class="fee-balance__value">${formatMoney(balance)}</div>
      </div>
      <div class="fee-breakdown">
        ${breakdown.map((b) => {
          const noteSuffix = b.outstanding > 0 && b.notes.size === 1 ? ` · ${escapeHtml([...b.notes][0])}` : "";
          return `
            <div class="fee-breakdown__row">
              <span class="fee-breakdown__name">${escapeHtml(b.name)}${noteSuffix}</span>
              <span class="fee-breakdown__amount ${b.outstanding > 0 ? "is-outstanding" : "is-clear"}">${b.outstanding > 0 ? formatMoney(b.outstanding) : "✓ Selesai"}</span>
            </div>
          `;
        }).join("")}
      </div>
    `;

    mount.innerHTML = `
      <h2>Yuran</h2>
      ${balanceBlock}
      ${waButton}
      <details class="fee-history">
        <summary><span class="fee-history__chevron" aria-hidden="true">▾</span> Sejarah Yuran</summary>
        <div class="table-wrap" style="margin-top:0.8rem;">
          ${student.fees.ledger.length ? `
            <table class="data-table">
              <thead><tr><th>Tarikh</th><th>Perkara</th><th>Jumlah</th></tr></thead>
              <tbody>
                ${student.fees.ledger.slice().sort((a, b) => a.date.localeCompare(b.date)).map((entry) => `
                  <tr>
                    <td>${formatDate(entry.date)}</td>
                    <td>${escapeHtml(feeEntryLabel(state, entry))}</td>
                    <td>${entry.type === "charge" ? "+" : "-"}${formatMoney(entry.amount)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>` : '<p class="empty-note">Tiada rekod yuran lagi.</p>'}
        </div>
      </details>
    `;
  }
})();
</script>
</body>
</html>
